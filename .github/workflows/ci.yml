name: Conflict studio shell
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lanetrace-labs/lanetrace-frontend
          path: lanetrace-frontend
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test lanetrace-frontend/test.mjs
